(()=>{'use strict';const cv=document.querySelector('#map'),ctx=cv.getContext('2d'),$=s=>document.querySelector(s);let W=64,H=45,tiles=[],civs=[],year=0,playing=false,speed=1,selected=-1,events=[],tickTimer=null;const colors=['#d76b5d','#efbc66','#77b8cb','#b591dc','#7cc58b','#df87b0','#a7bb73','#d2a37a','#8ca4ef','#d8d27c','#e68f79','#83c6ba','#bba2dc','#c4b08e','#a0d7d0','#c7a0a0','#b3cd88','#df9acb','#a0b1db','#ddbd91','#95c9a0','#c6a5a0','#bbbdde','#a9c3b4','#deaaae'];const names=['Varn','Elar','Khor','Meridia','Ashen','Solari','Tavren','Nym','Orun','Belari','Thessa','Kaelor','Istria','Dornar','Velis','Reth','Othari','Nareth','Yvara','Keld','Sora','Mavren','Eldan','Taris','Uldra'];let seed=1, camera={x:0,y:0,z:1}, particles=[],roads=[],frame=0,drag=null,dirty=true;const hash=(x,y,k=0)=>{let v=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return v-Math.floor(v)};function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}function ri(n){return Math.floor(rand()*n)}function at(x,y){return y*W+x}function neighbor(x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H)}function log(s){events.unshift(`Year ${year}: ${s}`);events=events.slice(0,90);renderFeed()}function renderFeed(){$('#feed').innerHTML=events.slice(0,35).map(e=>`<div style="padding:3px 0;border-bottom:1px solid #30404a">${e.replace(/</g,'&lt;')}</div>`).join('')}function generate(){let size=$('#size').value;W=size==='small'?48:size==='large'?82:64;H=Math.round(W*.70);let count=size==='small'?5:size==='large'?18:10;seed=(Date.now()>>>0)||1;tiles=[];civs=[];year=0;events=[];selected=-1;playing=false;$('#play').textContent='▶ Play';let blobs=Array.from({length:13},()=>({x:rand()*W,y:rand()*H,r:5+rand()*17}));for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let b of blobs){let d=Math.hypot((x-b.x)*1.05,(y-b.y)*1.15);v+=Math.max(0,1-d/b.r)*.68}v+=rand()*.28-.12;let land=v>.34&&x>1&&y>1&&x<W-2&&y<H-2;let terrain=!land?'sea':v>.99?'mountain':v>.76?'hill': function draw(now){frame=now;let cw=cv.clientWidth,ch=cv.clientHeight;ctx.clearRect(0,0,cw,ch);let sea=ctx.createLinearGradient(0,0,0,ch);sea.addColorStop(0,'#102d40');sea.addColorStop(1,'#1d4b60');ctx.fillStyle=sea;ctx.fillRect(0,0,cw,ch);let p0=worldPoint(0,0),ts=p0.tile;let terrainColors={sea:'#2b6073',plain:'#72966a',forest:'#436e53',hill:'#918a69',mountain:'#8b9290',dry:'#bba36d'};

function step(){year++;for(let c of civs){if(!c||c.pop<=0)continue;c.age++;let owned=[];for(let i=0;i<tiles.length;i++)if(tiles[i].owner===c.id)owned.push(i);let food=0,wood=0,ore=0;for(let i of owned){let r=tiles[i].resource;if(r==='food'||r==='fish')food+=1.3;if(r==='wood')wood+=.7;if(r==='ore')ore+=.38}c.food+=food*(1+c.tech*.12)-c.pop/120;c.wood+=wood;c.ore+=ore;c.wealth+=owned.length*.05+c.trade*.3-c.pop*.0015;if(c.food>0){let growth=Math.max(0,Math.floor(c.pop*(.012+Math.min(.02,c.food/15000))));c.pop+=growth;c.food-=growth*.18}else{let loss=Math.max(1,Math.floor(c.pop*.035));c.pop-=loss;if(year%12===0)log(`${c.name} suffers famine.`)}if(c.pop<20)c.pop=20;if(c.food<0)c.food=0;let expansionChance=.16+c.focus*.13;if(rand()<expansionChance&&c.food>4){let frontier=[];for(let i of owned){let x=i%W,y=Math.floor(i/W);for(let [nx,ny] of neighbor(x,y)){let ni=at(nx,ny),t=tiles[ni];if(t.owner===-1&&t.terrain!=='sea'&&t.terrain!=='mountain')frontier.push(ni)}}if(frontier.length){let i=frontier[ri(frontier.length)];tiles[i].owner=c.id;c.food-=3;c.wood=Math.max(0,c.wood-1)}}if(rand()<.035&&c.wood>18&&c.food>20&&owned.length>6){let possible=owned.filter(i=>!tiles[i].city&&tiles[i].terrain!=='mountain');if(possible.length){let i=possible[ri(possible.length)];tiles[i].city=true;tiles[i].pop=50;c.wood-=18;c.food-=15;log(`${c.name} founds a new settlement.`)}}if(rand()<.014+c.focus*.005&&c.wealth>20){c.tech++;c.wealth-=20;log(`${c.name} advances its knowledge (level ${c.tech}).`)}if(rand()<.006&&c.trade>.4){let partners=civs.filter(z=>z.id!==c.id&&z.pop>0);if(partners.length){let p=partners[ri(partners.length)];let amount=Math.min(12,Math.max(0,c.food-20));if(amount>0&&p.food<25){c.food-=amount;p.food+=amount;c.wealth+=amount*.5;p.wealth=Math.max(0,p.wealth-amount*.4);log(`${c.name} trades food with ${p.name}.`)}}}let cities=owned.filter(i=>tiles[i].city);for(let i of cities)tiles[i].pop=Math.floor(c.pop/Math.max(1,cities.length));}if(year%15===0){let strongest=[...civs].sort((a,b)=>b.pop-a.pop)[0];if(strongest)log(`${strongest.name} is the most populous civilisation (${strongest.pop.toLocaleString()} people).`)}if(year%3===0)render();else updateStats()}function updateStats(){$('#year').textContent=`Year ${year}`;$('#stats').textContent=`${civs.length} civilisations · ${civs.reduce((s,c)=>s+c.pop,0).toLocaleString()} people`;$('#status').textContent=playing?`${speed}× running`:'Paused'}function updateDetails(){if(selected<0){$('#details').textContent='Tap a settlement or coloured territory to inspect its civilisation.';return}let c=civs[selected];if(!c)return;let n=tiles.filter(t=>t.owner===selected).length;$('#details').innerHTML=`<b style="color:${c.color}">${c.name}</b> · ${n} territories · ${c.pop.toLocaleString()} people<br>🌾 Food ${Math.round(c.food)} · 🪵 Wood ${Math.round(c.wood)} · ⛏ Ore ${Math.round(c.ore)} · 🪙 Wealth ${Math.round(c.wealth)}<br>📚 Knowledge level ${c.tech} · ${Math.round(c.aggression*100)}% militarism · ${Math.round(c.trade*100)}% trade focus`;}let pointers=new Map(),touchStart=null;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)touchStart={x:e.clientX,y:e.clientY,camx:camera.x,camy:camera.y,moved:false}});cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&touchStart){let dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.hypot(dx,dy)>7)touchStart.moved=true;camera.x=touchStart.camx+dx;camera.y=touchStart.camy+dy}else if(pointers.size===2){let arr=[...pointers.values()],dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(camera.prevDist)camera.z=Math.max(.65,Math.min(5,camera.z*dist/camera.prevDist));camera.prevDist=dist;touchStart=null}});cv.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);camera.prevDist=null;if(touchStart&&!touchStart.moved){let r=cv.getBoundi
