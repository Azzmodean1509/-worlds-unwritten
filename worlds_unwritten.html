<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b23"><title>Worlds Unwritten</title><style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#edf2ef;font:14px system-ui,-apple-system,sans-serif}header{padding:12px 14px;background:#172630;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small{color:#9eafb6}button,select{background:#293d49;color:white;border:1px solid #49606a;border-radius:9px;padding:10px;font:inherit}button:active{background:#526b74}.bar{display:flex;gap:7px;padding:9px;flex-wrap:wrap;align-items:center}.bar button{flex:1}#map{display:block;width:100%;height:auto;touch-action:manipulation;background:#152e43;image-rendering:auto}.panel{margin:9px;padding:12px;background:#192a34;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.feed{height:128px;overflow:auto;color:#c6d1d0;font-size:12px}.tag{font-weight:700;color:#c8d9bb}#details{min-height:66px}footer{text-align:center;color:#869ca4;font-size:11px;padding:10px}</style></head><body><header><div><h1>🌍 Worlds Unwritten</h1><small>Autonomous civilisation simulator · Alpha 0.1</small></div><div id="year">Year 0</div></header><div class="bar"><select id="size"><option value="small">Small world</option><option value="medium" selected>Medium world</option><option value="large">Large world</option></select><button id="new">New World</button><button id="save">Save</button><button id="load">Load</button></div><canvas id="map"></canvas><div class="bar"><button id="play">▶ Play</button><button data-speed="1">1×</button><button data-speed="5">5×</button><button data-speed="20">20×</button><button data-speed="100">100×</button></div><section class="panel"><div class="row"><span id="stats">Generating...</span><span id="status">Paused</span></div><div id="details">Tap a settlement or coloured territory to inspect its civilisation.</div></section><section class="panel"><b>📜 Chronicle</b><div id="feed" class="feed"></div></section><footer>Tap the map to inspect · Local save · No network required</footer><script>
(()=>{'use strict';const cv=document.querySelector('#map'),ctx=cv.getContext('2d'),$=s=>document.querySelector(s);let W=64,H=45,tiles=[],civs=[],year=0,playing=false,speed=1,selected=-1,events=[],tickTimer=null;const colors=['#d76b5d','#efbc66','#77b8cb','#b591dc','#7cc58b','#df87b0','#a7bb73','#d2a37a','#8ca4ef','#d8d27c','#e68f79','#83c6ba','#bba2dc','#c4b08e','#a0d7d0','#c7a0a0','#b3cd88','#df9acb','#a0b1db','#ddbd91','#95c9a0','#c6a5a0','#bbbdde','#a9c3b4','#deaaae'];const names=['Varn','Elar','Khor','Meridia','Ashen','Solari','Tavren','Nym','Orun','Belari','Thessa','Kaelor','Istria','Dornar','Velis','Reth','Othari','Nareth','Yvara','Keld','Sora','Mavren','Eldan','Taris','Uldra'];let seed=1;function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}function ri(n){return Math.floor(rand()*n)}function at(x,y){return y*W+x}function neighbor(x,y){return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H)}function log(s){events.unshift(`Year ${year}: ${s}`);events=events.slice(0,90);renderFeed()}function renderFeed(){$('#feed').innerHTML=events.slice(0,35).map(e=>`<div style="padding:3px 0;border-bottom:1px solid #30404a">${e.replace(/</g,'&lt;')}</div>`).join('')}function generate(){let size=$('#size').value;W=size==='small'?48:size==='large'?82:64;H=Math.round(W*.70);let count=size==='small'?5:size==='large'?18:10;seed=(Date.now()>>>0)||1;tiles=[];civs=[];year=0;events=[];selected=-1;playing=false;$('#play').textContent='▶ Play';let blobs=Array.from({length:13},()=>({x:rand()*W,y:rand()*H,r:5+rand()*17}));for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let b of blobs){let d=Math.hypot((x-b.x)*1.05,(y-b.y)*1.15);v+=Math.max(0,1-d/b.r)*.68}v+=rand()*.28-.12;let land=v>.34&&x>1&&y>1&&x<W-2&&y<H-2;let terrain=!land?'sea':v>.99?'mountain':v>.76?'hill':rand()<.27?'forest':rand()<.12?'dry':'plain';let resource=terrain==='forest'?'wood':terrain==='mountain'?'ore':terrain==='hill'?'stone':terrain==='sea'?'fish':terrain==='plain'?'food':'clay';tiles.push({terrain,resource,owner:-1,city:false,pop:0})}let candidates=tiles.map((t,i)=>({t,i})).filter(o=>o.t.terrain==='plain'||o.t.terrain==='forest');for(let j=0;j<count;j++){let spots=candidates.filter(o=>civs.every(c=>Math.hypot(o.i%W-c.cap%W,Math.floor(o.i/W)-Math.floor(c.cap/W))>6));if(!spots.length)break;let cap=spots[ri(spots.length)].i;let civ={id:j,name:names[j],color:colors[j],cap,tiles:[],food:35+ri(35),wood:15+ri(20),ore:ri(12),wealth:20+ri(20),pop:100+ri(140),tech:1,focus:rand(),aggression:rand(),trade:rand(),age:0};civs.push(civ);tiles[cap].owner=j;tiles[cap].city=true;tiles[cap].pop=civ.pop;for(let [nx,ny] of neighbor(cap%W,Math.floor(cap/W))){let t=tiles[at(nx,ny)];if(t.terrain!=='sea')t.owner=j}}log(`${civs.length} peoples establish their first settlements.`);resize();render()}function resize(){let dpr=Math.min(devicePixelRatio||1,2);let width=Math.min(window.innerWidth,850);let height=Math.round(width*H/W);cv.width=Math.round(width*dpr);cv.height=Math.round(height*dpr);cv.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}function step(){year++;for(let c of civs){if(!c||c.pop<=0)continue;c.age++;let owned=[];for(let i=0;i<tiles.length;i++)if(tiles[i].owner===c.id)owned.push(i);let food=0,wood=0,ore=0;for(let i of owned){let r=tiles[i].resource;if(r==='food'||r==='fish')food+=1.3;if(r==='wood')wood+=.7;if(r==='ore')ore+=.38}c.food+=food*(1+c.tech*.12)-c.pop/120;c.wood+=wood;c.ore+=ore;c.wealth+=owned.length*.05+c.trade*.3-c.pop*.0015;if(c.food>0){let growth=Math.max(0,Math.floor(c.pop*(.012+Math.min(.02,c.food/15000))));c.pop+=growth;c.food-=growth*.18}else{let loss=Math.max(1,Math.floor(c.pop*.035));c.pop-=loss;if(year%12===0)log(`${c.name} suffers famine.`)}if(c.pop<20)c.pop=20;if(c.food<0)c.food=0;let expansionChance=.16+c.focus*.13;if(rand()<expansionChance&&c.food>4){let frontier=[];for(let i of owned){let x=i%W,y=Math.floor(i/W);for(let [nx,ny] of neighbor(x,y)){let ni=at(nx,ny),t=tiles[ni];if(t.owner===-1&&t.terrain!=='sea'&&t.terrain!=='mountain')frontier.push(ni)}}if(frontier.length){let i=frontier[ri(frontier.length)];tiles[i].owner=c.id;c.food-=3;c.wood=Math.max(0,c.wood-1)}}if(rand()<.035&&c.wood>18&&c.food>20&&owned.length>6){let possible=owned.filter(i=>!tiles[i].city&&tiles[i].terrain!=='mountain');if(possible.length){let i=possible[ri(possible.length)];tiles[i].city=true;tiles[i].pop=50;c.wood-=18;c.food-=15;log(`${c.name} founds a new settlement.`)}}if(rand()<.014+c.focus*.005&&c.wealth>20){c.tech++;c.wealth-=20;log(`${c.name} advances its knowledge (level ${c.tech}).`)}if(rand()<.006&&c.trade>.4){let partners=civs.filter(z=>z.id!==c.id&&z.pop>0);if(partners.length){let p=partners[ri(partners.length)];let amount=Math.min(12,Math.max(0,c.food-20));if(amount>0&&p.food<25){c.food-=amount;p.food+=amount;c.wealth+=amount*.5;p.wealth=Math.max(0,p.wealth-amount*.4);log(`${c.name} trades food with ${p.name}.`)}}}let cities=owned.filter(i=>tiles[i].city);for(let i of cities)tiles[i].pop=Math.floor(c.pop/Math.max(1,cities.length));}if(year%15===0){let strongest=[...civs].sort((a,b)=>b.pop-a.pop)[0];if(strongest)log(`${strongest.name} is the most populous civilisation (${strongest.pop.toLocaleString()} people).`)}if(year%3===0)render();else updateStats()}function render(){let width=cv.width/Math.min(devicePixelRatio||1,2),height=cv.height/Math.min(devicePixelRatio||1,2),sx=width/W,sy=height/H;ctx.clearRect(0,0,width,height);let terrainColors={sea:'#20425a',plain:'#647f55',forest:'#315f4c',hill:'#827e61',mountain:'#a0a09a',dry:'#aa966a'};for(let y=0;y<H;y++)for(let x=0;x<W;x++){let t=tiles[at(x,y)],px=x*sx,py=y*sy;ctx.fillStyle=terrainColors[t.terrain];ctx.fillRect(px,py,sx+.4,sy+.4);if(t.owner>=0){ctx.fillStyle=civs[t.owner].color;ctx.globalAlpha=.43;ctx.fillRect(px,py,sx+.4,sy+.4);ctx.globalAlpha=1;if(t.owner===selected){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(px,py,sx,sy)}}if(t.city){ctx.fillStyle='#f9edc8';ctx.beginPath();ctx.arc(px+sx/2,py+sy/2,Math.max(2,sx*.35),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#26333b';ctx.lineWidth=1;ctx.stroke()}}updateStats();updateDetails()}function updateStats(){$('#year').textContent=`Year ${year}`;$('#stats').textContent=`${civs.length} civilisations · ${civs.reduce((s,c)=>s+c.pop,0).toLocaleString()} people`;$('#status').textContent=playing?`${speed}× running`:'Paused'}function updateDetails(){if(selected<0){$('#details').textContent='Tap a settlement or coloured territory to inspect its civilisation.';return}let c=civs[selected];if(!c)return;let n=tiles.filter(t=>t.owner===selected).length;$('#details').innerHTML=`<b style="color:${c.color}">${c.name}</b> · ${n} territories · ${c.pop.toLocaleString()} people<br>🌾 Food ${Math.round(c.food)} · 🪵 Wood ${Math.round(c.wood)} · ⛏ Ore ${Math.round(c.ore)} · 🪙 Wealth ${Math.round(c.wealth)}<br>📚 Knowledge level ${c.tech} · ${Math.round(c.aggression*100)}% militarism · ${Math.round(c.trade*100)}% trade focus`;}cv.addEventListener('click',e=>{let rect=cv.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left)/rect.width*W),y=Math.floor((e.clientY-rect.top)/rect.height*H);if(x>=0&&y>=0&&x<W&&y<H){selected=tiles[at(x,y)].owner;render()}});$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'⏸ Pause':'▶ Play';updateStats()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(q=>q.style.borderColor=q===b?'#e3c27a':'#49606a');updateStats()});$('#new').onclick=generate;$('#save').onclick=()=>{try{localStorage.setItem('worlds-unwritten-v1',JSON.stringify({W,H,tiles,civs,year,events,seed}));log('World saved locally.')}catch(e){alert('Could not save: '+e.message)}};$('#load').onclick=()=>{try{let s=JSON.parse(localStorage.getItem('worlds-unwritten-v1'));if(!s){alert('No saved world found.');return}({W,H,tiles,civs,year,events,seed}=s);playing=false;selected=-1;$('#play').textContent='▶ Play';resize();renderFeed();render()}catch(e){alert('Could not load save: '+e.message)}};window.addEventListener('resize',()=>{resize();render()});let last=performance.now(),acc=0;function loop(now){let dt=Math.min(1000,now-last);last=now;if(playing){acc+=dt;let interval=1000/(speed===100?60:speed===20?20:speed===5?5:1);let steps=0;while(acc>=interval&&steps<80){step();acc-=interval;steps++}}else acc=0;requestAnimationFrame(loop)}generate();requestAnimationFrame(loop)})();
</script></body></html>
